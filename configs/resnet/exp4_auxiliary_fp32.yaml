# Experimento 4: D40 como tarea principal + grietas (D00, D10, D20) como tareas auxiliares.
# Misma configuración que exp2_pretrained para aislar el efecto de las tareas auxiliares (comparar contra exp2).
# Si exp3 resulta mejor en PR-AUC de val, usar augment: true y comparar contra exp3.
# La selección de checkpoint, el threshold y las métricas principales siguen usando solo D40.
# Variante fp32 (amp: false) para GTX 1650: AMP deja NaN en BatchNorm. Ver exp2_pretrained_fp32.yaml.
experiment_id: exp4_auxiliary_fp32
based_on: exp2_pretrained_fp32
pretrained: true
augment: false
aux_classes: [D00, D10, D20]
aux_weight: 0.4
image_size: 224
batch_size: 32
epochs: 15
lr: 0.0001
weight_decay: 0.0001
patience: 4
num_workers: 2
seed: 42
amp: false
