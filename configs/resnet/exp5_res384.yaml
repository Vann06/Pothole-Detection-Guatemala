# Experimento 5: exp2_pretrained_fp32 con resolución 384 en lugar de 224 (única diferencia).
# Hipótesis (medida SOLO en train): las imágenes train son de 600-720 px y a 224 px el lado menor
# de una caja D40 queda en mediana 13 px (62.7 % < 16 px); a 384 px la mediana es 22 px (26.6 % < 16 px).
# Reducir menos la imagen debería preservar baches pequeños. Batch 32 cabe en GTX 1650 (fp32, ~2.2 GB).
experiment_id: exp5_res384
based_on: exp2_pretrained_fp32
pretrained: true
augment: false
image_size: 384
batch_size: 32
epochs: 15
lr: 0.0001
weight_decay: 0.0001
patience: 4
num_workers: 4
seed: 42
amp: false
