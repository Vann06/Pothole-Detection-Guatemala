# Experimento 2 en fp32: idéntico a exp2_pretrained salvo amp: false.
# Motivo: en GTX 1650 (CUDA), AMP/fp16 desborda en el forward y deja NaN en las
# estadísticas running_mean/running_var de BatchNorm (layer4); GradScaler omite el paso,
# pero BN ya se actualizó y la validación produce scores NaN.
# EfficientNet-B0 se entrenó en MPS, donde el entrenador desactiva AMP, es decir en fp32;
# por tanto este es el control ResNet18 comparable bajo el mismo protocolo.
experiment_id: exp2_pretrained_fp32
pretrained: true
augment: false
image_size: 224
batch_size: 32
epochs: 15
lr: 0.0001
weight_decay: 0.0001
patience: 4
num_workers: 4
seed: 42
amp: false
