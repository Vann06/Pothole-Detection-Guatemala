# vae por parches: imagen a 512, el vae ve parches de 64x64 (64 por imagen)
# mismo train, misma seleccion y mismos thresholds que vae_base; agrega el score patch_norm
experiment_id: vae_patch512
latent: 128
image_size: 512
patch_size: 64
patch: 64
batch_size: 8  # imagenes por batch, o sea 512 parches
epochs: 30
lr: 0.001
patience: 8
warmup_epochs: 5
std_floor_frac: 0.1
num_workers: 2
seed: 42
amp: true
use_cache: true
latency_images: 200
